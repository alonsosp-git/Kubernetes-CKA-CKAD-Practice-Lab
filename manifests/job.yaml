apiVersion: batch/v1
kind: Job
metadata:
  name: data-import
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 4
  template:
    metadata:
      labels:
        job-name: data-import
    spec:
      restartPolicy: Never
      containers:
        - name: importer
          image: busybox:1.36
          command: ["sh", "-c", "echo importing; sleep 3"]
