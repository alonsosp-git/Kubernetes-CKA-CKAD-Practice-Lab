apiVersion: apps/v1
kind: Deployment
metadata:
  name: hungry
  labels:
    app: hungry
spec:
  replicas: 6
  selector:
    matchLabels:
      app: hungry
  template:
    metadata:
      labels:
        app: hungry
    spec:
      containers:
        - name: app
          image: nginx:1.25
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
