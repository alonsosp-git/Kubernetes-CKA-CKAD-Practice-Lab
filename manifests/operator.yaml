apiVersion: v1
kind: Namespace
metadata:
  name: operators
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-operator
  namespace: operators
  labels:
    app: backup-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backup-operator
  template:
    metadata:
      labels:
        app: backup-operator
    spec:
      serviceAccountName: default
      containers:
        - name: manager
          image: lab.example.com/backup-operator:v1.2.0
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
